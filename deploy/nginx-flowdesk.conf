server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name commongroundmigration.duckdns.org;
    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/commongroundmigration.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/commongroundmigration.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name commongroundmigration.duckdns.org;
    return 301 https://commongroundmigration.duckdns.org$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 165.154.203.178 _;
    return 301 https://commongroundmigration.duckdns.org$request_uri;
}
